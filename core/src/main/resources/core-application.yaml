spring:
  datasource:
    url: jdbc:postgresql://${JIFELOG_DB_HOST}/${JIFELOG_DB_NAME}
    username: ${JIFELOG_DB_USER}
    password: ${JIFELOG_DB_PASSWORD}

minio:
  endpoint: https://minio.jifelog.com:9000
  access-key: ${JIFELOG_MINIO_ACCESS_KEY}
  secret-key: ${JIFELOG_MINIO_SECRET_KEY}
  bucket: ${JIFELOG_MINIO_BUCKET}
  presigned-url-expiry-minutes: 15

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace