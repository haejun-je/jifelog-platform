spring:
  datasource:
    url: jdbc:postgresql://${JIFELOG_DB_HOST}/${JIFELOG_DB_NAME}
    username: ${JIFELOG_DB_USER}
    password: ${JIFELOG_DB_PASSWORD}

minio:
  endpoint: ${MINIO_ENDPOINT:http://10.25.0.54:9000}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_BUCKET:jifelog-dev}
  presigned-url-expiry-minutes: 15

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace