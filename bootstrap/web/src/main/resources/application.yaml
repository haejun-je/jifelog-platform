spring:
  application:
    name: jifelog-platform
  config:
    import:
      - "optional:classpath:core-application.yaml"

jifelog:
  security:
    jwt:
      secret: ${JIFELOG_JWT_SECRET}


management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health
server:
  port: 8082