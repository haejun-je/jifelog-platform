        - SAD
        - ANGRY
        - ANXIOUS
        - TIRED
      x-enum-descriptions:
        HAPPY: 행복
        EXCITED: 신남
        NEUTRAL: 보통
        SAD: 슬픔
        ANGRY: 화남
        ANXIOUS: 불안
        TIRED: 피곤

