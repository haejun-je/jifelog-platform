          enum: [HAPPY, EXCITED, NEUTRAL, SAD, ANGRY, ANXIOUS, TIRED]
          example: HAPPY
        weather:
          type: string
          description: 날씨
          enum: [SUNNY, CLOUDY, RAIN, SNOW, HAIL, TYPHOON]
