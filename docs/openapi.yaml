        - RAIN
        - SNOW
        - HAIL
        - TYPHOON
      x-enum-descriptions:
        SUNNY: 맑음
        CLOUDY: 흐림
        RAIN: 비
        SNOW: 눈
        HAIL: 우박
        TYPHOON: 태풍

    ApiErrorResponse:
      type: object
      description: API 에러 공통 응답 형식
      properties:
        data:
          $ref: '#/components/schemas/ErrorBody'

    ErrorBody:
      type: object
      description: 에러 상세 정보
      properties:
        error_code:
          type: string
          description: |
            에러 코드 (`E[Category]_[Domain]_[Seq]` 형식)

            | 코드 | HTTP 상태 | 설명 |
            |------|----------|------|
            | EB_00_001 | 400 | 요청 값이 올바르지 않음 (유효성 검증 실패) |
            | EB_00_002 | 400 | 요청 본문을 읽을 수 없음 (파싱 오류) |
            | EB_02_002 | 400 | 지원하지 않는 콘텐츠 타입 (일기 사진) |
            | EN_01_001 | 404 | 존재하지 않는 계정 |
            | EN_02_001 | 404 | 존재하지 않는 일기 |
            | EC_01_001 | 409 | 이미 사용 중인 닉네임 |
            | EC_02_001 | 409 | 이미 작성된 일기가 존재함 |
            | ES_00_001 | 500 | 서버 내부 오류 |
            | ES_03_001 | 500 | 이미지 업로드 URL 생성 실패 (스토리지) |
          example: EN_02_001
        message:
          type: string
          description: 에러 메시지
          example: "존재하지 않는 일기입니다."
        details:
          description: |
            에러 상세 정보 목록 (유효성 검증 실패 시 필드별 오류 제공, 그 외에는 null)
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/ValidationErrorDetail'
          example: null

    ValidationErrorDetail:
      type: object
      description: 유효성 검증 오류 상세 정보
      properties:
        field:
          type: string
          description: 유효성 검증에 실패한 필드명
          example: "content"
        message:
          type: string
          description: 유효성 검증 실패 메시지
          example: "must not be blank"